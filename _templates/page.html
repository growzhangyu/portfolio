{% extends "!page.html" %}

{% block footer %}
  {{ super() }}

  <!-- 动态在版权行后插入 ICP 备案号 -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // 找到 Furo 的第一个版权段落
      const footerInner = document.querySelector(".footer__inner");
      if (!footerInner) return;

      // 查找第一个 <p> 或直接插入到 footer__inner
      const firstP = footerInner.querySelector("p");
      if (firstP) {
        // 在版权段落末尾添加 ICP
        const icp = document.createElement("span");
        icp.innerHTML = " · <a href='https://beian.miit.gov.cn/' target='_blank' style='color: inherit; text-decoration: none;'>鄂ICP备2026022688号</a>";
        firstP.appendChild(icp);
      }
    });
  </script>
{% endblock %}
